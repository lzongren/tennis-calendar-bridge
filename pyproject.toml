[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-calendar-bridge"
version = "0.2.0"
description = "Private-first tennis schedule aggregator with iCalendar export."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Zongren Liu" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "playwright>=1.44.0",
  "icalendar>=7.0,<8",
  "recurring-ical-events>=3.8.2,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.0",
  "ruff>=0.12",
  "twine>=6.0",
  "Jinja2>=3.1",
  "PyYAML>=6.0",
]

[project.scripts]
tennis-overview = "tennis_overview.cli:main"

[tool.setuptools.packages.find]
include = ["tennis_overview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the established rule set stable across Ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
